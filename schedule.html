<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>赛程 - 2026世界杯预测分析</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        /* 赛程页额外样式 */
        .date-section {
            margin-bottom: 2rem;
        }
        
        .date-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1rem;
            padding: 1rem 1.5rem;
            background: linear-gradient(135deg, #1a365d 0%, #2c5282 100%);
            border-radius: 12px;
            border-left: 4px solid #4299e1;
        }
        
        .date-badge {
            font-size: 1.25rem;
            font-weight: 700;
            color: #fff;
        }
        
        .weekday {
            padding: 0.25rem 0.75rem;
            background: rgba(255,255,255,0.15);
            border-radius: 20px;
            font-size: 0.875rem;
            color: rgba(255,255,255,0.9);
        }
        
        .match-count {
            margin-left: auto;
            font-size: 0.875rem;
            color: rgba(255,255,255,0.7);
        }
        
        .matches-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1rem;
        }
        
        .match-card {
            background: linear-gradient(145deg, #1a365d 0%, #234876 100%);
            border-radius: 12px;
            padding: 1.25rem;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid rgba(255,255,255,0.1);
            position: relative;
            overflow: hidden;
        }
        
        .match-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, #4299e1, #667eea);
            opacity: 0;
            transition: opacity 0.3s;
        }
        
        .match-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 40px rgba(0,0,0,0.3);
            border-color: rgba(66,153,225,0.5);
        }
        
        .match-card:hover::before {
            opacity: 1;
        }
        
        .match-teams {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            margin-bottom: 0.75rem;
        }
        
        .team {
            flex: 1;
            text-align: center;
        }
        
        .team-name {
            font-size: 1rem;
            font-weight: 600;
            color: #fff;
            margin-bottom: 0.5rem;
        }
        
        .team-flag {
            width: 40px;
            height: 30px;
            border-radius: 4px;
            margin: 0 auto;
            background: rgba(255,255,255,0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
        }
        
        .match-vs {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
        }
        
        .vs-text {
            font-size: 0.875rem;
            font-weight: 700;
            color: #4299e1;
            background: rgba(66,153,225,0.15);
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
        }
        
        .match-info-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-top: 0.75rem;
            border-top: 1px solid rgba(255,255,255,0.1);
            font-size: 0.8rem;
            color: rgba(255,255,255,0.6);
        }
        
        .match-datetime {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .match-datetime svg {
            width: 14px;
            height: 14px;
        }
        
        .match-venue {
            color: rgba(255,255,255,0.5);
            max-width: 120px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        
        .group-badge {
            display: inline-block;
            padding: 0.2rem 0.6rem;
            background: linear-gradient(135deg, #4299e1 0%, #667eea 100%);
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 600;
            color: #fff;
        }
        
        .analysis-hint {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-top: 0.75rem;
            font-size: 0.8rem;
            color: #4299e1;
            justify-content: center;
        }
        
        /* 响应式 */
        @media (max-width: 768px) {
            .matches-grid {
                grid-template-columns: 1fr;
            }
            
            .date-header {
                padding: 0.75rem 1rem;
                flex-wrap: wrap;
            }
            
            .date-badge {
                font-size: 1rem;
            }
            
            .match-count {
                width: 100%;
                margin-left: 0;
                margin-top: 0.5rem;
            }
            
            .match-info-row {
                flex-direction: column;
                align-items: flex-start;
                gap: 0.5rem;
            }
            
            .match-venue {
                max-width: 100%;
            }
            
            .team-name {
                font-size: 0.9rem;
            }
        }
        
        /* 弹窗样式 */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        
        .modal-overlay.active {
            display: flex;
        }
        
        .modal-content {
            background: linear-gradient(145deg, #1a365d 0%, #234876 100%);
            border-radius: 16px;
            max-width: 700px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
            border: 1px solid rgba(255,255,255,0.1);
        }
        
        .modal-close {
            position: absolute;
            top: 1rem;
            right: 1rem;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(255,255,255,0.1);
            border: none;
            color: #fff;
            font-size: 1.5rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            z-index: 10;
        }
        
        .modal-close:hover {
            background: rgba(255,255,255,0.2);
        }
        
        .modal-body {
            padding: 2rem;
        }
        
        .analysis-modal {
            color: #fff;
        }
        
        .modal-header-section {
            text-align: center;
            margin-bottom: 2rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        
        .modal-group-badge {
            display: inline-block;
            padding: 0.4rem 1rem;
            background: linear-gradient(135deg, #4299e1 0%, #667eea 100%);
            border-radius: 20px;
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 1rem;
        }
        
        .modal-header-section h2 {
            font-size: 1.75rem;
            margin-bottom: 0.5rem;
        }
        
        .modal-match-info {
            color: rgba(255,255,255,0.6);
            font-size: 0.9rem;
        }
        
        .ai-prediction {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }
        
        .ai-badge {
            font-size: 1.1rem;
            font-weight: 600;
            color: #4299e1;
            text-align: center;
        }
        
        .prediction-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }
        
        @media (max-width: 600px) {
            .prediction-grid {
                grid-template-columns: 1fr;
            }
        }
        
        .prediction-card {
            background: rgba(0,0,0,0.2);
            border-radius: 12px;
            padding: 1.25rem;
        }
        
        .card-subtitle {
            font-size: 0.875rem;
            color: rgba(255,255,255,0.6);
            margin-bottom: 1rem;
        }
        
        .probability-bars {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }
        
        .prob-item {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }
        
        .prob-label {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
        }
        
        .prob-bar {
            height: 8px;
            background: rgba(255,255,255,0.1);
            border-radius: 4px;
            overflow: hidden;
        }
        
        .prob-fill {
            height: 100%;
            border-radius: 4px;
            transition: width 1s ease;
        }
        
        .prob-item.win .prob-fill { background: #48bb78; }
        .prob-item.draw .prob-fill { background: #ecc94b; }
        .prob-item.lose .prob-fill { background: #fc8181; }
        
        .score-prediction {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
        }
        
        .score-team {
            flex: 1;
            font-size: 0.9rem;
            text-align: center;
        }
        
        .score-numbers {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 2rem;
            font-weight: 700;
        }
        
        .score-divider {
            color: #4299e1;
        }
        
        .alternative-scores {
            margin-top: 0.75rem;
            font-size: 0.8rem;
            color: rgba(255,255,255,0.5);
            text-align: center;
        }
        
        .alt-score {
            margin: 0 0.25rem;
            color: rgba(255,255,255,0.7);
        }
        
        .analysis-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }
        
        @media (max-width: 600px) {
            .analysis-grid {
                grid-template-columns: 1fr;
            }
        }
        
        .analysis-card {
            background: rgba(0,0,0,0.2);
            border-radius: 12px;
            padding: 1.25rem;
        }
        
        .card-header {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }
        
        .card-icon {
            font-size: 1.25rem;
        }
        
        .card-title {
            font-size: 0.95rem;
            font-weight: 600;
            margin: 0;
        }
        
        .advantage-list {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
        }
        
        .advantage-item {
            display: flex;
            align-items: flex-start;
            gap: 0.5rem;
            font-size: 0.85rem;
            color: rgba(255,255,255,0.8);
            line-height: 1.4;
        }
        
        .item-bullet {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-top: 0.35rem;
            flex-shrink: 0;
        }
        
        .item-bullet.green { background: #48bb78; }
        .item-bullet.orange { background: #ed8936; }
        
        .risk-section {
            background: rgba(0,0,0,0.2);
            border-radius: 12px;
            padding: 1.25rem;
        }
        
        .risk-section h4 {
            font-size: 1rem;
            margin: 0 0 1rem 0;
        }
        
        .risk-items {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }
        
        .risk-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }
        
        .risk-icon {
            font-size: 1.25rem;
        }
        
        .risk-content {
            flex: 1;
        }
        
        .risk-title {
            font-size: 0.8rem;
            color: rgba(255,255,255,0.6);
            margin-bottom: 0.25rem;
        }
        
        .risk-bar-container {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .risk-bar {
            flex: 1;
            height: 6px;
            background: rgba(255,255,255,0.1);
            border-radius: 3px;
            overflow: hidden;
        }
        
        .risk-fill {
            height: 100%;
            background: linear-gradient(90deg, #4299e1, #667eea);
            border-radius: 3px;
        }
        
        .risk-value {
            font-size: 0.8rem;
            font-weight: 600;
            color: #4299e1;
            min-width: 35px;
        }
        
        .alert-box {
            margin-top: 1rem;
            padding: 0.75rem 1rem;
            background: rgba(66,153,225,0.15);
            border-radius: 8px;
            display: flex;
            align-items: flex-start;
            gap: 0.5rem;
            font-size: 0.85rem;
            color: rgba(255,255,255,0.9);
            line-height: 1.5;
        }
        
        .alert-icon {
            flex-shrink: 0;
        }
        
        /* 锁定分析样式 */
        .locked-analysis {
            text-align: center;
            padding: 2rem 1rem;
        }
        
        .lock-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
        }
        
        .locked-analysis h3 {
            margin: 0 0 0.5rem 0;
            font-size: 1.25rem;
        }
        
        .locked-analysis p {
            color: rgba(255,255,255,0.6);
            margin: 0 0 1.5rem 0;
        }
        
        .unlock-countdown {
            margin-bottom: 2rem;
        }
        
        .unlock-countdown span {
            color: rgba(255,255,255,0.6);
            font-size: 0.9rem;
        }
        
        .countdown-time {
            display: block;
            font-size: 2rem;
            font-weight: 700;
            color: #4299e1;
            margin-top: 0.5rem;
            font-family: monospace;
        }
        
        .preview-teaser {
            background: rgba(0,0,0,0.2);
            border-radius: 12px;
            padding: 1.25rem;
            text-align: left;
        }
        
        .preview-teaser h4 {
            margin: 0 0 0.75rem 0;
            font-size: 0.95rem;
        }
        
        .preview-teaser ul {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        
        .preview-teaser li {
            font-size: 0.85rem;
            color: rgba(255,255,255,0.7);
        }
    </style>
</head>
<body>
    <!-- 导航栏 -->
    <nav class="main-nav">
        <div class="nav-container">
            <a href="index.html" class="nav-logo">
                <span class="logo-icon">⚽</span>
                <span class="logo-text">世界杯预测</span>
            </a>
            <ul class="nav-menu">
                <li><a href="index.html" class="nav-link">首页</a></li>
                <li><a href="schedule.html" class="nav-link active">赛程</a></li>
                <li><a href="#" class="nav-link">小组积分</a></li>
                <li><a href="#" class="nav-link">实时赔率</a></li>
                <li><a href="#" class="nav-link">赛事新闻</a></li>
            </ul>
            <button class="nav-toggle" id="navToggle">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>
    </nav>

    <!-- 页面标题 -->
    <header class="page-header">
        <div class="container">
            <h1 class="page-title">🏆 赛程表</h1>
            <p class="page-subtitle">2026世界杯 · 共72场比赛 · 点击比赛查看AI分析</p>
        </div>
    </header>

    <!-- 赛程内容 -->
    <section class="section schedule-section">
        <div class="container">
            <!-- 比赛列表容器 -->
            <div class="matches-container" id="matchesContainer">
                <!-- 比赛卡片将由JS动态生成 -->
            </div>
        </div>
    </section>

    <!-- 弹窗 -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-content" id="modalContent">
            <button class="modal-close" id="modalClose">×</button>
            <div class="modal-body" id="modalBody">
                <!-- 弹窗内容由JS生成 -->
            </div>
        </div>
    </div>

    <!-- 页脚 -->
    <footer class="site-footer">
        <div class="container">
            <div class="footer-content">
                <div class="footer-brand">
                    <span class="footer-logo">⚽</span>
                    <span class="footer-text">2026世界杯预测分析</span>
                </div>
                <div class="footer-disclaimer">
                    <p>本平台仅供娱乐参考，请理性观看比赛</p>
                    <p>AI预测结果仅供参考，不构成投注建议</p>
                </div>
                <div class="footer-links">
                    <p>© 2026 FIFA World Cup Prediction. All rights reserved.</p>
                </div>
            </div>
        </div>
    </footer>

    <script>
        // 数据
        let scheduleData = null;

        // 加载赛程数据
        async function loadSchedule() {
            try {
                const response = await fetch('./data/schedule.json');
                scheduleData = await response.json();
                renderMatches(scheduleData.matches);
            } catch (error) {
                console.error('加载赛程失败:', error);
                document.getElementById('matchesContainer').innerHTML = '<p style="color:#fff;text-align:center;">加载赛程数据失败，请刷新页面重试。</p>';
            }
        }

        // 渲染比赛列表 - 按日期分组
        function renderMatches(matches) {
            const container = document.getElementById('matchesContainer');
            
            // 按日期分组
            const groupedMatches = {};
            matches.forEach(match => {
                if (!groupedMatches[match.date]) {
                    groupedMatches[match.date] = [];
                }
                groupedMatches[match.date].push(match);
            });

            let html = '';
            // 按日期排序
            Object.keys(groupedMatches).sort().forEach(date => {
                const dateObj = new Date(date);
                const month = dateObj.getMonth() + 1;
                const day = dateObj.getDate();
                const dateStr = `${month}月${day}日`;
                const weekDay = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'][dateObj.getDay()];
                const matchesInDay = groupedMatches[date];
                
                html += `
                    <div class="date-section">
                        <div class="date-header">
                            <span class="date-badge">${dateStr}</span>
                            <span class="weekday">${weekDay}</span>
                            <span class="match-count">${matchesInDay.length}场比赛</span>
                        </div>
                        <div class="matches-grid">
                `;
                
                matchesInDay.forEach(match => {
                    const venue = scheduleData.venues[match.venue] || {name: match.city || '待定', city: ''};
                    html += createMatchCard(match, venue);
                });
                
                html += `
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;

            // 绑定点击事件
            document.querySelectorAll('.match-card').forEach(card => {
                card.addEventListener('click', () => {
                    const matchId = parseInt(card.dataset.matchId);
                    openAnalysisModal(matchId);
                });
            });
        }

        // 创建比赛卡片
        function createMatchCard(match, venue) {
            return `
                <div class="match-card" data-match-id="${match.id}" data-group="${match.group}">
                    <div class="match-teams">
                        <div class="team">
                            <div class="team-name">${match.home}</div>
                            <div class="team-flag">${getTeamEmoji(match.home)}</div>
                        </div>
                        <div class="match-vs">
                            <span class="vs-text">VS</span>
                            <span class="group-badge">${match.group}组</span>
                        </div>
                        <div class="team">
                            <div class="team-name">${match.away}</div>
                            <div class="team-flag">${getTeamEmoji(match.away)}</div>
                        </div>
                    </div>
                    <div class="match-info-row">
                        <div class="match-datetime">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="12" cy="12" r="10"/>
                                <polyline points="12,6 12,12 16,14"/>
                            </svg>
                            <span>${formatTime(match.time)}</span>
                        </div>
                        <span class="match-venue">${venue.name}</span>
                    </div>
                    <div class="analysis-hint">
                        <span>点击查看AI分析 →</span>
                    </div>
                </div>
            `;
        }

        // 打开分析弹窗
        function openAnalysisModal(matchId) {
            const match = scheduleData.matches.find(m => m.id === matchId);
            if (!match) return;

            const venue = scheduleData.venues[match.venue] || {name: match.city || '待定', city: ''};
            const modalBody = document.getElementById('modalBody');
            
            // 检查是否赛前12小时内
            const matchDateTime = new Date(`${match.date}T${match.time}:00`);
            const now = new Date();
            const hoursUntilMatch = (matchDateTime - now) / (1000 * 60 * 60);
            const isUnlocked = hoursUntilMatch <= 12;

            modalBody.innerHTML = `
                <div class="analysis-modal">
                    <div class="modal-header-section">
                        <span class="modal-group-badge">${match.group}组 第${match.round}轮</span>
                        <h2>${match.home} vs ${match.away}</h2>
                        <p class="modal-match-info">${match.date} · ${formatTime(match.time)} · ${venue.name}</p>
                    </div>
                    
                    ${isUnlocked ? `
                        <div class="analysis-content">
                            <div class="ai-prediction">
                                <div class="ai-badge">🤖 AI预测分析</div>
                                
                                <div class="prediction-grid">
                                    <div class="prediction-card">
                                        <div class="card-subtitle">胜负预测</div>
                                        <div class="probability-bars">
                                            <div class="prob-item win">
                                                <div class="prob-label">
                                                    <span class="country-name">${match.home} 胜</span>
                                                    <span class="prob-value">${generateProbability()}%</span>
                                                </div>
                                                <div class="prob-bar">
                                                    <div class="prob-fill" style="width: ${generateProbability()}%"></div>
                                                </div>
                                            </div>
                                            <div class="prob-item draw">
                                                <div class="prob-label">
                                                    <span class="country-name">平局</span>
                                                    <span class="prob-value">${generateProbability()}%</span>
                                                </div>
                                                <div class="prob-bar">
                                                    <div class="prob-fill" style="width: ${generateProbability()}%"></div>
                                                </div>
                                            </div>
                                            <div class="prob-item lose">
                                                <div class="prob-label">
                                                    <span class="country-name">${match.away} 胜</span>
                                                    <span class="prob-value">${generateProbability()}%</span>
                                                </div>
                                                <div class="prob-bar">
                                                    <div class="prob-fill" style="width: ${generateProbability()}%"></div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                    
                                    <div class="prediction-card">
                                        <div class="card-subtitle">比分预测</div>
                                        <div class="score-prediction">
                                            <span class="score-team">${match.home}</span>

                                        </div>

                                <div class="risk-section">
                                    <h4>🔮 冷门概率分析</h4>
                                    <div class="risk-items">
                                        <div class="risk-item">
                                            <span class="risk-icon">⚡</span>
                                            <div class="risk-content">
                                                <span class="risk-title">意外结果概率</span>
                                                <div class="risk-bar-container">
                                                    <div class="risk-bar">
                                                        <div class="risk-fill" style="width: ${Math.floor(Math.random() * 30) + 10}%"></div>
                                                    </div>
                                                    <span class="risk-value">${Math.floor(Math.random() * 30) + 10}%</span>

                                        </div>
                                    </div>
                                    <div class="alert-box">
                                        <span class="alert-icon">💡</span>
                                        <span class="alert-text">综合分析显示本场${match.home}获胜概率较高，但${match.away}具备一定反击能力，建议关注临场数据变化。</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    ` : `
                        <div class="locked-analysis">
                            <div class="lock-icon">🔒</div>
                            <h3>详细分析已锁定</h3>
                            <p>赛前12小时解锁详细AI预测与分析</p>
                            <div class="unlock-countdown">
                                <span>距离解锁还有</span>

                                    <li>✅ 关键球员数据</li>
                                </ul>
                            </div>
                        </div>
                    `}
                </div>
            `;

            document.getElementById('modalOverlay').classList.add('active');

            // 如果未解锁，启动倒计时
            if (!isUnlocked) {
                startUnlockCountdown(matchDateTime);
            }
        }

        // 关闭弹窗
        function closeModal() {
            document.getElementById('modalOverlay').classList.remove('active');
        }

        // 工具函数
        function formatTime(time) {
            const [hours, minutes] = time.split(':');
            return `${hours}:${minutes}`;

        function startUnlockCountdown(targetDate) {
            function update() {
                const now = new Date();
                const diff = targetDate - now - (12 * 60 * 60 * 1000);
                
                if (diff <= 0) {
                    document.getElementById('unlockCountdown').textContent = '已解锁!';
                    return;
                }

                const hours = Math.floor(diff / (1000 * 60 * 60));
                const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((diff % (1000 * 60)) / 1000);

                document.getElementById('unlockCountdown').textContent = 
                    `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
            }
            
            update();
            setInterval(update, 1000);
        }

        // 导航功能
        function initNavigation() {
            const navToggle = document.getElementById('navToggle');
            const navMenu = document.querySelector('.nav-menu');
            const mainNav = document.querySelector('.main-nav');

            navToggle.addEventListener('click', () => {
                navToggle.classList.toggle('active');
                navMenu.classList.toggle('active');
            });

            window.addEventListener('scroll', () => {
                if (window.scrollY > 100) {
                    mainNav.classList.add('scrolled');
                } else {
                    mainNav.classList.remove('scrolled');
                }
            });
        }

        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            loadSchedule();
            initNavigation();

            document.getElementById('modalClose').addEventListener('click', closeModal);
            document.getElementById('modalOverlay').addEventListener('click', (e) => {
                if (e.target === e.currentTarget) {
                    closeModal();
                }
            });
            
            // ESC关闭弹窗
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    closeModal();
                }
            });
        });
    </script>
