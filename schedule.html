<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>赛程 - 2026世界杯预测分析</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- 导航栏 -->
    <nav class="main-nav" id="mainNav">
        <div class="nav-container">
            <a href="index.html" class="nav-logo">
                <span class="logo-icon">⚽</span>
                <span class="logo-text">世界杯预测</span>
            </a>
            <ul class="nav-menu" id="navMenu">
                <li><a href="index.html" class="nav-link">首页</a></li>
                <li><a href="schedule.html" class="nav-link active">赛程</a></li>
                <li><a href="standings.html" class="nav-link">小组积分</a></li>
                <li><a href="news.html" class="nav-link">赛事新闻</a></li>
                <li><a href="analysis.html" class="nav-link">实时分析</a></li>
            </ul>
            <button class="nav-toggle" id="navToggle">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>
    </nav>

    <!-- 主内容 -->
    <main class="page-content">
        <div class="container">
            <div class="section-header">
                <span class="section-badge">赛程</span>
                <h1 class="section-title">比赛日程</h1>
                <p class="section-desc">2026世界杯小组赛完整赛程，支持按组别筛选</p>
            </div>

            <!-- 筛选栏 -->
            <div class="filter-bar">
                <div class="filter-tabs" id="filterTabs">
                    <button class="filter-tab all active" data-group="all">全部</button>
                    <button class="filter-tab" data-group="A">A组</button>
                    <button class="filter-tab" data-group="B">B组</button>
                    <button class="filter-tab" data-group="C">C组</button>
                    <button class="filter-tab" data-group="D">D组</button>
                    <button class="filter-tab" data-group="E">E组</button>
                    <button class="filter-tab" data-group="F">F组</button>
                    <button class="filter-tab" data-group="G">G组</button>
                    <button class="filter-tab" data-group="H">H组</button>
                    <button class="filter-tab" data-group="I">I组</button>
                    <button class="filter-tab" data-group="J">J组</button>
                    <button class="filter-tab" data-group="K">K组</button>
                    <button class="filter-tab" data-group="L">L组</button>
                </div>
            </div>

            <!-- 赛程列表 -->
            <div class="schedule-list" id="scheduleList">
                <!-- 动态加载 -->
            </div>
        </div>
    </main>

    <!-- 弹窗 -->
    <div class="modal-overlay" id="matchModal">
        <div class="modal">
            <div class="modal-header">
                <h3 class="modal-title" id="modalTitle">比赛分析</h3>
                <button class="modal-close" onclick="closeModal()">×</button>
            </div>
            <div class="modal-body" id="modalBody">
                <!-- 动态内容 -->
            </div>
        </div>
    </div>

    <!-- 页脚 -->
    <footer class="site-footer">
        <div class="container">
            <div class="footer-content">
                <div class="footer-brand">
                    <span class="footer-logo">⚽</span>
                    <span class="footer-text">2026世界杯预测分析</span>
                </div>
                <div class="footer-disclaimer">
                    <p>本平台仅供娱乐参考，请理性观看比赛</p>
                    <p>AI预测结果仅供参考，不构成投注建议</p>
                </div>
            </div>
        </div>
    </footer>

    <script>
        // 数据
        let scheduleData = null;
        let analysisData = null;
        let currentGroup = 'all';

        // 初始化
        document.addEventListener('DOMContentLoaded', async () => {
            initNavigation();
            await loadData();
            initFilters();
            renderSchedule();
        });

        // 导航
        function initNavigation() {
            const navToggle = document.getElementById('navToggle');
            const navMenu = document.getElementById('navMenu');
            const mainNav = document.getElementById('mainNav');

            navToggle.addEventListener('click', () => {
                navToggle.classList.toggle('active');
                navMenu.classList.toggle('active');
            });

            window.addEventListener('scroll', () => {
                if (window.scrollY > 100) {
                    mainNav.classList.add('scrolled');
                } else {
                    mainNav.classList.remove('scrolled');
                }
            });
        }

        // 加载数据
        async function loadData() {
            try {
                const [scheduleRes, analysisRes] = await Promise.all([
                    fetch('data/schedule.json'),
                    fetch('data/analysis.json')
                ]);
                scheduleData = await scheduleRes.json();
                analysisData = await analysisRes.json();
            } catch (e) {
                console.error('数据加载失败:', e);
                document.getElementById('scheduleList').innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">⚠️</div>
                        <div class="empty-state-title">数据加载失败</div>
                        <p class="empty-state-desc">请刷新页面重试</p>
                    </div>
                `;
            }
        }

        // 筛选器
        function initFilters() {
            const tabs = document.querySelectorAll('.filter-tab');
            tabs.forEach(tab => {
                tab.addEventListener('click', () => {
                    tabs.forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');
                    currentGroup = tab.dataset.group;
                    renderSchedule();
                });
            });
        }

        // 获取比赛分析
        function getMatchAnalysis(matchId) {
            if (!analysisData || !analysisData.matches) return null;
            return analysisData.matches.find(m => m.match_id === matchId);
        }

        // 渲染赛程
        function renderSchedule() {
            const container = document.getElementById('scheduleList');
            if (!scheduleData || !scheduleData.matches) return;

            let matches = scheduleData.matches;
            if (currentGroup !== 'all') {
                matches = matches.filter(m => m.group === currentGroup);
            }

            if (matches.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📅</div>
                        <div class="empty-state-title">暂无比赛</div>
                        <p class="empty-state-desc">该小组暂无比赛安排</p>
                    </div>
                `;
                return;
            }

            // 按日期分组
            const groupedMatches = {};
            matches.forEach(match => {
                const dateKey = match.date;
                if (!groupedMatches[dateKey]) {
                    groupedMatches[dateKey] = [];
                }
                groupedMatches[dateKey].push(match);
            });

            let html = '';
            Object.keys(groupedMatches).sort().forEach(date => {
                const dayMatches = groupedMatches[date];
                html += `
                    <div class="group-section">
                        <h3 class="group-title">
                            <span>📅</span>
                            <span>${formatDateFull(date)}</span>
                            <span style="font-size: 0.9rem; color: var(--text-muted); font-weight: normal;">(${dayMatches.length}场比赛)</span>
                        </h3>
                        <div style="display: grid; gap: 15px;">
                            ${dayMatches.map(match => renderMatchCard(match)).join('')}
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        // 渲染比赛卡片
        function renderMatchCard(match) {
            const venue = scheduleData.venues[match.venue] || {};
            const analysis = getMatchAnalysis(match.id);
            
            let scoreHtml;
            if (match.status === 'completed' && match.homeScore !== undefined) {
                scoreHtml = `
                    <div class="schedule-score">${match.homeScore} - ${match.awayScore}</div>
                `;
            } else {
                scoreHtml = `<div class="schedule-score vs">VS</div>`;
            }

            const statusText = match.status === 'completed' ? '已结束' : 
                               match.status === 'live' ? '进行中' : '未开始';
            const statusClass = match.status;

            return `
                <div class="schedule-card" onclick="openMatchModal(${match.id})">
                    <div class="schedule-card-header">
                        <div class="schedule-date">
                            <span>${match.group}组 · 第${match.round}轮</span>
                        </div>
                        <span class="match-status ${statusClass}">${statusText}</span>
                    </div>
                    <div class="schedule-teams">
                        <div class="schedule-team">
                            <div>
                                <div class="schedule-team-name">${match.home}</div>
                                <div class="schedule-team-code">FIFA #--</div>
                            </div>
                        </div>
                        ${scoreHtml}
                        <div class="schedule-team away">
                            <div>
                                <div class="schedule-team-name">${match.away}</div>
                                <div class="schedule-team-code">FIFA #--</div>
                            </div>
                        </div>
                    </div>
                    <div class="schedule-venue">
                        <span>🕐 ${match.time}</span>
                        <span>🏟️ ${venue.name || match.city || ''}</span>
                    </div>
                </div>
            `;
        }

        // 打开弹窗
        function openMatchModal(matchId) {
            const match = scheduleData.matches.find(m => m.id === matchId);
            const analysis = getMatchAnalysis(matchId);
            const venue = scheduleData.venues[match.venue] || {};

            if (!match) return;

            const score = match.homeScore !== undefined ? 
                `${match.homeScore} - ${match.awayScore}` : 'VS';
            const statusText = match.status === 'completed' ? '已结束' : 
                               match.status === 'live' ? '进行中' : '未开始';

            let analysisContent = '';
            if (analysis && analysis.analysis) {
                const a = analysis.analysis;
                analysisContent = `
                    <div class="analysis-section">
                        <h4 class="analysis-section-title">战术分析</h4>
                        <p class="analysis-text">${a.tactics || '暂无战术分析'}</p>
                    </div>
                    <div class="analysis-section">
                        <h4 class="analysis-section-title">关键球员</h4>
                        <p class="analysis-text">${a.key_players || '暂无关键球员信息'}</p>
                    </div>
                    <div class="analysis-section">
                        <h4 class="analysis-section-title">赔率分析</h4>
                        <p class="analysis-text">${a.odds_analysis || '暂无赔率分析'}</p>
                    </div>
                    <div class="analysis-section">
                        <h4 class="analysis-section-title">冷门因素</h4>
                        <p class="analysis-text">${a.upset_factors || '暂无冷门分析'}</p>
                    </div>
                    ${a.prediction ? `
                    <div class="analysis-prediction">
                        <div class="prediction-score">${a.prediction.score || '--'}</div>
                        <div class="prediction-result">${a.prediction.result || '预测中'}</div>
                        <span class="prediction-confidence">置信度: ${a.prediction.confidence || '中'}</span>
                    </div>
                    ` : ''}
                `;
            } else {
                analysisContent = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📊</div>
                        <div class="empty-state-title">暂无详细分析</div>
                        <p class="empty-state-desc">分析数据正在生成中</p>
                    </div>
                `;
            }

            document.getElementById('modalTitle').textContent = `${match.home} vs ${match.away}`;
            document.getElementById('modalBody').innerHTML = `
                <div style="text-align: center; margin-bottom: 25px;">
                    <div style="font-size: 2.5rem; font-weight: 800; color: var(--gold); margin-bottom: 10px;">${score}</div>
                    <div style="color: var(--text-muted);">
                        <span>${match.group}组 · 第${match.round}轮</span>
                    </div>
                    <div style="color: var(--text-muted); margin-top: 8px;">
                        📅 ${formatDateFull(match.date)} ${match.time}
                    </div>
                    <div style="color: var(--text-muted); margin-top: 5px;">
                        🏟️ ${venue.name || match.city || ''} · ${venue.city || ''}
                    </div>
                    <div style="color: var(--text-muted); margin-top: 5px;">
                        ${statusText}
                    </div>
                </div>
                ${analysisContent}
            `;

            document.getElementById('matchModal').classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        // 关闭弹窗
        function closeModal() {
            document.getElementById('matchModal').classList.remove('active');
            document.body.style.overflow = '';
        }

        // 点击遮罩关闭
        document.getElementById('matchModal').addEventListener('click', (e) => {
            if (e.target.id === 'matchModal') {
                closeModal();
            }
        });

        // ESC关闭弹窗
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeModal();
            }
        });

        // 格式化日期
        function formatDateFull(dateStr) {
            const date = new Date(dateStr);
            const weekdays = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
            return `${date.getFullYear()}年${date.getMonth() + 1}月${date.getDate()}日 ${weekdays[date.getDay()]}`;
        }
    </script>
</body>
</html>
