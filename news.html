<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>赛事新闻 - 2026世界杯预测分析</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- 导航栏 -->
    <nav class="main-nav" id="mainNav">
        <div class="nav-container">
            <a href="index.html" class="nav-logo">
                <span class="logo-icon">⚽</span>
                <span class="logo-text">世界杯预测</span>
            </a>
            <ul class="nav-menu" id="navMenu">
                <li><a href="index.html" class="nav-link">首页</a></li>
                <li><a href="schedule.html" class="nav-link">赛程</a></li>
                <li><a href="standings.html" class="nav-link">小组积分</a></li>
                <li><a href="news.html" class="nav-link active">赛事新闻</a></li>
                <li><a href="analysis.html" class="nav-link">实时分析</a></li>
            </ul>
            <button class="nav-toggle" id="navToggle">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>
    </nav>

    <!-- 主内容 -->
    <main class="page-content">
        <div class="container">
            <div class="section-header">
                <span class="section-badge">资讯</span>
                <h1 class="section-title">赛事新闻</h1>
                <p class="section-desc">最新球队动态、比赛报道与热点资讯</p>
            </div>

            <!-- 分类标签 -->
            <div class="filter-bar">
                <div class="filter-tabs" id="categoryTabs">
                    <button class="filter-tab all active" data-category="all">全部</button>
                    <button class="filter-tab" data-category="赛况报道">赛况报道</button>
                    <button class="filter-tab" data-category="综合热点">综合热点</button>
                    <button class="filter-tab" data-category="前瞻分析">前瞻分析</button>
                    <button class="filter-tab" data-category="球员动态">球员动态</button>
                </div>
            </div>

            <!-- 新闻列表 -->
            <div class="news-grid" id="newsGrid">
                <!-- 动态加载 -->
            </div>
        </div>
    </main>

    <!-- 侧滑面板遮罩 -->
    <div class="slide-panel-overlay" id="slideOverlay" onclick="closeSlidePanel()"></div>

    <!-- 侧滑面板 -->
    <div class="slide-panel" id="slidePanel">
        <div class="slide-panel-header">
            <h3 class="modal-title">新闻详情</h3>
            <button class="modal-close" onclick="closeSlidePanel()">×</button>
        </div>
        <div class="slide-panel-body" id="slidePanelBody">
            <!-- 动态内容 -->
        </div>
    </div>

    <!-- 页脚 -->
    <footer class="site-footer">
        <div class="container">
            <div class="footer-content">
                <div class="footer-brand">
                    <span class="footer-logo">⚽</span>
                    <span class="footer-text">2026世界杯预测分析</span>
                </div>
                <div class="footer-disclaimer">
                    <p>本平台仅供娱乐参考，请理性观看比赛</p>
                    <p>AI预测结果仅供参考，不构成投注建议</p>
                </div>
            </div>
        </div>
    </footer>

    <script>
        // 数据
        let newsData = null;
        let currentCategory = 'all';

        // 初始化
        document.addEventListener('DOMContentLoaded', async () => {
            initNavigation();
            await loadData();
            initFilters();
            renderNews();
        });

        // 导航
        function initNavigation() {
            const navToggle = document.getElementById('navToggle');
            const navMenu = document.getElementById('navMenu');
            const mainNav = document.getElementById('mainNav');

            navToggle.addEventListener('click', () => {
                navToggle.classList.toggle('active');
                navMenu.classList.toggle('active');
            });

            window.addEventListener('scroll', () => {
                if (window.scrollY > 100) {
                    mainNav.classList.add('scrolled');
                } else {
                    mainNav.classList.remove('scrolled');
                }
            });
        }

        // 加载数据
        async function loadData() {
            try {
                const res = await fetch('data/news.json');
                newsData = await res.json();
            } catch (e) {
                console.error('数据加载失败:', e);
                document.getElementById('newsGrid').innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">⚠️</div>
                        <div class="empty-state-title">数据加载失败</div>
                        <p class="empty-state-desc">请刷新页面重试</p>
                    </div>
                `;
            }
        }

        // 分类标签颜色
        const categoryColors = {
            '赛况报道': 'rgba(0, 212, 170, 0.15)',
            '综合热点': 'rgba(233, 69, 96, 0.15)',
            '前瞻分析': 'rgba(245, 197, 24, 0.15)',
            '球员动态': 'rgba(96, 165, 250, 0.15)'
        };

        const categoryTextColors = {
            '赛况报道': 'var(--success)',
            '综合热点': 'var(--accent)',
            '前瞻分析': 'var(--gold)',
            '球员动态': '#60a5fa'
        };

        // 筛选器
        function initFilters() {
            const tabs = document.querySelectorAll('.filter-tab');
            tabs.forEach(tab => {
                tab.addEventListener('click', () => {
                    tabs.forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');
                    currentCategory = tab.dataset.category;
                    renderNews();
                });
            });
        }

        // 渲染新闻
        function renderNews() {
            const container = document.getElementById('newsGrid');
            if (!newsData || !newsData.news) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📰</div>
                        <div class="empty-state-title">暂无新闻</div>
                        <p class="empty-state-desc">新闻正在加载中</p>
                    </div>
                `;
                return;
            }

            let news = newsData.news;
            if (currentCategory !== 'all') {
                news = news.filter(n => n.category === currentCategory);
            }

            if (news.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📰</div>
                        <div class="empty-state-title">暂无相关新闻</div>
                        <p class="empty-state-desc">该分类下暂无新闻</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = news.map(item => {
                const color = categoryColors[item.category] || 'rgba(136, 146, 176, 0.15)';
                const textColor = categoryTextColors[item.category] || 'var(--text-muted)';
                
                return `
                    <div class="news-card" onclick="openNewsDetail(${item.id})">
                        <div class="news-content">
                            <span class="news-category" style="background: ${color}; color: ${textColor};">
                                ${item.category}
                            </span>
                            <h3 class="news-title">${item.title}</h3>
                            <p class="news-summary">${item.summary}</p>
                            <div class="news-meta">
                                <span class="news-source">
                                    📰 ${item.source || '未知来源'}
                                </span>
                                <span>🕐 ${formatTime(item.publishTime)}</span>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // 打开新闻详情
        function openNewsDetail(newsId) {
            const newsItem = newsData.news.find(n => n.id === newsId);
            if (!newsItem) return;

            const color = categoryColors[newsItem.category] || 'rgba(136, 146, 176, 0.15)';
            const textColor = categoryTextColors[newsItem.category] || 'var(--text-muted)';

            document.getElementById('slidePanelBody').innerHTML = `
                <div style="margin-bottom: 20px;">
                    <span class="news-category" style="background: ${color}; color: ${textColor};">
                        ${newsItem.category}
                    </span>
                </div>
                <h2 style="font-size: 1.5rem; font-weight: 700; margin-bottom: 15px; line-height: 1.4;">
                    ${newsItem.title}
                </h2>
                <div style="display: flex; gap: 15px; margin-bottom: 25px; padding-bottom: 20px; border-bottom: 1px solid rgba(136, 146, 176, 0.1);">
                    <span style="color: var(--text-muted); font-size: 0.9rem;">
                        📰 ${newsItem.source || '未知来源'}
                    </span>
                    <span style="color: var(--text-muted); font-size: 0.9rem;">
                        🕐 ${formatTimeFull(newsItem.publishTime)}
                    </span>
                </div>
                <div style="line-height: 1.8; color: var(--text-muted); font-size: 1rem;">
                    ${newsItem.summary}
                </div>
                ${newsItem.sourceUrl ? `
                    <div style="margin-top: 30px; padding-top: 20px; border-top: 1px solid rgba(136, 146, 176, 0.1);">
                        <a href="${newsItem.sourceUrl}" target="_blank" style="color: var(--accent); display: flex; align-items: center; gap: 8px;">
                            <span>🔗</span>
                            <span>查看原文</span>
                        </a>
                    </div>
                ` : ''}
            `;

            document.getElementById('slidePanel').classList.add('active');
            document.getElementById('slideOverlay').classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        // 关闭侧滑面板
        function closeSlidePanel() {
            document.getElementById('slidePanel').classList.remove('active');
            document.getElementById('slideOverlay').classList.remove('active');
            document.body.style.overflow = '';
        }

        // ESC关闭面板
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeSlidePanel();
            }
        });

        // 格式化时间
        function formatTime(dateStr) {
            if (!dateStr) return '';
            const date = new Date(dateStr);
            const now = new Date();
            const diff = now - date;
            
            // 几分钟前
            if (diff < 60 * 1000) return '刚刚';
            if (diff < 60 * 60 * 1000) return Math.floor(diff / (60 * 1000)) + '分钟前';
            if (diff < 24 * 60 * 60 * 1000) return Math.floor(diff / (60 * 60 * 1000)) + '小时前';
            if (diff < 7 * 24 * 60 * 60 * 1000) return Math.floor(diff / (24 * 60 * 60 * 1000)) + '天前';
            
            return `${date.getMonth() + 1}/${date.getDate()}`;
        }

        function formatTimeFull(dateStr) {
            if (!dateStr) return '';
            const date = new Date(dateStr);
            return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')} ${String(date.getHours()).padStart(2, '0')}:${String(date.getMinutes()).padStart(2, '0')}`;
        }
    </script>
</body>
</html>
