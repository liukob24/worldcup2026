<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>实时分析 - 2026世界杯预测分析</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- 导航栏 -->
    <nav class="main-nav" id="mainNav">
        <div class="nav-container">
            <a href="index.html" class="nav-logo">
                <span class="logo-icon">⚽</span>
                <span class="logo-text">世界杯预测</span>
            </a>
            <ul class="nav-menu" id="navMenu">
                <li><a href="index.html" class="nav-link">首页</a></li>
                <li><a href="schedule.html" class="nav-link">赛程</a></li>
                <li><a href="standings.html" class="nav-link">小组积分</a></li>
                <li><a href="news.html" class="nav-link">赛事新闻</a></li>
                <li><a href="analysis.html" class="nav-link active">实时分析</a></li>
            </ul>
            <button class="nav-toggle" id="navToggle">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>
    </nav>

    <!-- 主内容 -->
    <main class="page-content">
        <div class="container">
            <div class="section-header">
                <span class="section-badge">🤖 AI分析</span>
                <h1 class="section-title">实时赛事分析</h1>
                <p class="section-desc">基于大数据与机器学习的比赛预测，胜负概率与比分分析</p>
            </div>

            <!-- 分析容器 -->
            <div class="analysis-container">
                <!-- 比赛选择器 -->
                <div class="match-selector">
                    <h3 class="match-selector-title">
                        <span>📋</span>
                        <span>选择比赛</span>
                    </h3>
                    
                    <!-- 组别筛选 -->
                    <div class="filter-tabs" id="filterTabs" style="margin-bottom: 15px;">
                        <button class="filter-tab all active" data-group="all">全部</button>
                        <button class="filter-tab" data-group="A">A</button>
                        <button class="filter-tab" data-group="B">B</button>
                        <button class="filter-tab" data-group="C">C</button>
                        <button class="filter-tab" data-group="D">D</button>
                        <button class="filter-tab" data-group="E">E</button>
                        <button class="filter-tab" data-group="F">F</button>
                        <button class="filter-tab" data-group="G">G</button>
                        <button class="filter-tab" data-group="H">H</button>
                        <button class="filter-tab" data-group="I">I</button>
                        <button class="filter-tab" data-group="J">J</button>
                        <button class="filter-tab" data-group="K">K</button>
                        <button class="filter-tab" data-group="L">L</button>
                    </div>

                    <div class="match-selector-list" id="matchSelectorList">
                        <!-- 动态加载 -->
                    </div>
                </div>

                <!-- 分析面板 -->
                <div class="analysis-panel" id="analysisPanel">
                    <div class="analysis-header">
                        <h3 class="analysis-match-title" id="analysisTitle">选择比赛查看分析</h3>
                        <p class="analysis-match-info" id="analysisInfo">从左侧列表选择比赛获取AI分析</p>
                    </div>
                    <div class="analysis-content" id="analysisContent">
                        <div class="empty-state">
                            <div class="empty-state-icon">🤖</div>
                            <div class="empty-state-title">等待分析</div>
                            <p class="empty-state-desc">选择比赛后显示AI分析结果</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- 页脚 -->
    <footer class="site-footer">
        <div class="container">
            <div class="footer-content">
                <div class="footer-brand">
                    <span class="footer-logo">⚽</span>
                    <span class="footer-text">2026世界杯预测分析</span>
                </div>
                <div class="footer-disclaimer">
                    <p>本平台仅供娱乐参考，请理性观看比赛</p>
                    <p>AI预测结果仅供参考，不构成投注建议</p>
                </div>
            </div>
        </div>
    </footer>

    <script>
        // 数据
        let scheduleData = null;
        let analysisData = null;
        let currentGroup = 'all';
        let selectedMatchId = null;

        // 初始化
        document.addEventListener('DOMContentLoaded', async () => {
            initNavigation();
            await loadData();
            initFilters();
            renderMatchSelector();
            // 自动选中第一场比赛并显示分析
            if (scheduleData && scheduleData.matches && scheduleData.matches.length > 0) {
                selectMatch(scheduleData.matches[0].id);
            }
        });

        // 导航
        function initNavigation() {
            const navToggle = document.getElementById('navToggle');
            const navMenu = document.getElementById('navMenu');
            const mainNav = document.getElementById('mainNav');

            navToggle.addEventListener('click', () => {
                navToggle.classList.toggle('active');
                navMenu.classList.toggle('active');
            });

            window.addEventListener('scroll', () => {
                if (window.scrollY > 100) {
                    mainNav.classList.add('scrolled');
                } else {
                    mainNav.classList.remove('scrolled');
                }
            });
        }

        // 加载数据
        async function loadData() {
            try {
                const [scheduleRes, analysisRes] = await Promise.all([
                    fetch('data/schedule.json'),
                    fetch('data/analysis.json')
                ]);
                scheduleData = await scheduleRes.json();
                analysisData = await analysisRes.json();
            } catch (e) {
                console.error('数据加载失败:', e);
            }
        }

        // 筛选器
        function initFilters() {
            const tabs = document.querySelectorAll('.filter-tab');
            tabs.forEach(tab => {
                tab.addEventListener('click', () => {
                    tabs.forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');
                    currentGroup = tab.dataset.group;
                    renderMatchSelector();
                });
            });
        }

        // 获取比赛分析
        function getMatchAnalysis(matchId) {
            if (!analysisData || !analysisData.matches) return null;
            // 尝试多种匹配方式
            let analysis = analysisData.matches.find(m => m.match_id === matchId);
            if (!analysis) {
                // 尝试按日期和球队名匹配
                const match = scheduleData.matches.find(m => m.id === matchId);
                if (match) {
                    analysis = analysisData.matches.find(m => 
                        m.home_name === match.home && 
                        m.away_name === match.away &&
                        m.date === match.date
                    );
                }
            }
            return analysis;
        }

        // 渲染比赛选择器
        function renderMatchSelector() {
            const container = document.getElementById('matchSelectorList');
            if (!scheduleData || !scheduleData.matches) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📅</div>
                        <div class="empty-state-title">加载中...</div>
                    </div>
                `;
                return;
            }

            let matches = scheduleData.matches;
            if (currentGroup !== 'all') {
                matches = matches.filter(m => m.group === currentGroup);
            }

            if (matches.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📅</div>
                        <div class="empty-state-title">暂无比赛</div>
                    </div>
                `;
                return;
            }

            container.innerHTML = matches.map(match => {
                const statusText = match.status === 'completed' ? '已结束' : 
                                   match.status === 'live' ? '进行中' : '未开始';
                const isSelected = selectedMatchId === match.id;
                
                let score = 'VS';
                if (match.status === 'completed' && match.homeScore !== undefined) {
                    score = `${match.homeScore} - ${match.awayScore}`;
                }

                return `
                    <div class="match-selector-item ${isSelected ? 'active' : ''}" 
                         onclick="selectMatch(${match.id})">
                        <div class="match-selector-teams">
                            ${match.home} vs ${match.away}
                        </div>
                        <div class="match-selector-info">
                            <span>${match.group}组 · ${formatDate(match.date)} ${match.time}</span>
                            <span>${score}</span>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // 选择比赛
        function selectMatch(matchId) {
            selectedMatchId = matchId;
            renderMatchSelector();
            showMatchAnalysis(matchId);
        }

        // 显示比赛分析
        function showMatchAnalysis(matchId) {
            const match = scheduleData.matches.find(m => m.id === matchId);
            const analysis = getMatchAnalysis(matchId);
            const venue = scheduleData.venues[match.venue] || {};

            if (!match) return;

            // 更新标题
            document.getElementById('analysisTitle').textContent = `${match.home} vs ${match.away}`;
            
            let score = 'VS';
            if (match.status === 'completed' && match.homeScore !== undefined) {
                score = `${match.homeScore} - ${match.awayScore}`;
            }
            
            const statusText = match.status === 'completed' ? '已结束' : 
                               match.status === 'live' ? '进行中' : '未开始';

            document.getElementById('analysisInfo').innerHTML = `
                ${match.group}组 · ${formatDate(match.date)} ${match.time} · ${score} · ${statusText}
            `;

            // 构建分析内容
            let content = '';

            if (analysis && analysis.analysis) {
                const a = analysis.analysis;
                
                content = `
                    <!-- 基本信息 -->
                    <div class="analysis-section">
                        <h4 class="analysis-section-title">比赛信息</h4>
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                            <div style="background: rgba(136, 146, 176, 0.05); padding: 15px; border-radius: 12px;">
                                <div style="color: var(--text-muted); font-size: 0.85rem; margin-bottom: 5px;">🏆 ${match.group}组 第${match.round}轮</div>
                                <div style="font-weight: 600;">${match.home}</div>
                                <div style="color: var(--text-muted); font-size: 0.9rem;">FIFA排名: ${analysis.home_ranking || '--'}</div>
                            </div>
                            <div style="background: rgba(136, 146, 176, 0.05); padding: 15px; border-radius: 12px;">
                                <div style="color: var(--text-muted); font-size: 0.85rem; margin-bottom: 5px;">🏆 VS</div>
                                <div style="font-weight: 600;">${match.away}</div>
                                <div style="color: var(--text-muted); font-size: 0.9rem;">FIFA排名: ${analysis.away_ranking || '--'}</div>
                            </div>
                        </div>
                    </div>

                    <!-- 场地信息 -->
                    <div class="analysis-section">
                        <h4 class="analysis-section-title">场地信息</h4>
                        <p class="analysis-text">
                            🏟️ ${venue.name || match.city || '未知场馆'}<br>
                            📍 ${venue.city || ''}, ${venue.country || ''}<br>
                            👥 容量: ${venue.capacity ? venue.capacity.toLocaleString() + '人' : '--'}
                            ${analysis.altitude ? `<br>⛰️ 海拔: ${analysis.altitude}米` : ''}
                        </p>
                    </div>

                    <!-- 战术分析 -->
                    <div class="analysis-section">
                        <h4 class="analysis-section-title">战术分析</h4>
                        <p class="analysis-text">${a.tactics || '暂无战术分析数据'}</p>
                    </div>

                    <!-- 关键球员 -->
                    <div class="analysis-section">
                        <h4 class="analysis-section-title">关键球员</h4>
                        <p class="analysis-text">${a.key_players || '暂无关键球员信息'}</p>
                    </div>

                    <!-- 赔率分析 -->
                    <div class="analysis-section">
                        <h4 class="analysis-section-title">赔率分析</h4>
                        <p class="analysis-text">${a.odds_analysis || '暂无赔率分析数据'}</p>
                    </div>

                    <!-- 冷门分析 -->
                    <div class="analysis-section">
                        <h4 class="analysis-section-title">冷门分析</h4>
                        <p class="analysis-text">${a.upset_factors || '暂无冷门分析数据'}</p>
                    </div>

                    <!-- 比分预测 -->
                    ${a.prediction ? `
                    <div class="analysis-prediction">
                        <div style="margin-bottom: 15px; font-size: 0.9rem; color: var(--text-muted);">🎯 比分预测</div>
                        <div class="prediction-score">${a.prediction.score || '--'}</div>
                        <div class="prediction-result">${a.prediction.result || '预测中'}</div>
                        <span class="prediction-confidence">置信度: ${a.prediction.confidence || '中'}</span>
                        ${a.prediction.upset_score ? `
                        <div class="prediction-alternative">
                            ⚡ 冷门比分: ${a.prediction.upset_score}
                        </div>
                        ` : ''}
                    </div>
                    ` : ''}

                    <!-- 总结 -->
                    <div class="analysis-section">
                        <h4 class="analysis-section-title">分析总结</h4>
                        <p class="analysis-text">
                            ${match.home} vs ${match.away} 的比赛将在 ${venue.name || match.city} 进行。
                            ${analysis.home_ranking && analysis.away_ranking ? 
                                `主队FIFA排名${analysis.home_ranking}位，客队排名${analysis.away_ranking}位。` : ''}
                            本场比赛值得关注的关键点包括战术安排、关键球员发挥以及场地因素影响。
                        </p>
                    </div>
                `;
            } else {
                content = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📊</div>
                        <div class="empty-state-title">暂无详细分析</div>
                        <p class="empty-state-desc">
                            比赛: ${match.home} vs ${match.away}<br>
                            时间: ${formatDate(match.date)} ${match.time}<br>
                            场地: ${venue.name || match.city || '未知'}<br><br>
                            分析数据正在生成中，请稍后再试。
                        </p>
                    </div>
                `;
            }

            document.getElementById('analysisContent').innerHTML = content;
        }

        // 格式化日期
        function formatDate(dateStr) {
            const date = new Date(dateStr);
            return `${date.getMonth() + 1}月${date.getDate()}日`;
        }
    </script>
</body>
</html>
