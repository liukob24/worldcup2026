<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026世界杯 - 实时赛事分析</title>
    <link rel="stylesheet" href="../第一版/网页/styles.css">
    <style>
        /* ==========================================
           实时分析页面专用样式
           ========================================== */
        
        .analysis-hero {
            min-height: 40vh;
            padding: 80px 0 40px;
        }

        .hero-subtitle.analysis-tag {
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.2), rgba(255, 215, 0, 0.1));
            padding: 8px 20px;
            border-radius: 30px;
            border: 1px solid rgba(255, 215, 0, 0.3);
            display: inline-block;
        }

        .live-filter {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .filter-badge {
            padding: 8px 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            font-size: 14px;
            color: var(--text-secondary);
            transition: all 0.3s;
        }

        .filter-badge.active {
            background: rgba(255, 215, 0, 0.2);
            border-color: var(--accent-gold);
            color: var(--accent-gold);
        }

        .time-indicator {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 20px;
        }

        .time-badge {
            background: linear-gradient(135deg, rgba(239, 68, 68, 0.2), rgba(239, 68, 68, 0.1));
            border: 1px solid rgba(239, 68, 68, 0.3);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 12px;
            color: #ef4444;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            background: #ef4444;
            border-radius: 50%;
            animation: pulse 1.5s ease-in-out infinite;
        }

        /* 比赛卡片样式 */
        .match-analysis-card {
            background: var(--gradient-card);
            border-radius: var(--radius-xl);
            border: 1px solid rgba(255, 215, 0, 0.15);
            overflow: hidden;
            box-shadow: var(--shadow-lg);
            margin-bottom: 30px;
            transition: all 0.3s;
        }

        .match-analysis-card:hover {
            border-color: rgba(255, 215, 0, 0.4);
            transform: translateY(-5px);
        }

        .match-quick-view {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            gap: 30px;
            padding: 30px;
            align-items: center;
            cursor: pointer;
            position: relative;
        }

        .quick-team {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 12px;
        }

        .quick-team-flag {
            font-size: 48px;
            line-height: 1;
        }

        .quick-team-name {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .quick-team-ranking {
            font-size: 12px;
            color: var(--text-muted);
        }

        .quick-vs {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .quick-vs-badge {
            width: 70px;
            height: 70px;
            background: var(--gradient-gold);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: 900;
            color: var(--primary-dark);
        }

        .quick-match-time {
            font-size: 14px;
            color: var(--accent-gold);
            font-weight: 600;
        }

        .quick-analysis-btn {
            position: absolute;
            bottom: 20px;
            right: 30px;
            padding: 8px 16px;
            background: rgba(255, 215, 0, 0.2);
            border: 1px solid var(--accent-gold);
            border-radius: 20px;
            font-size: 12px;
            color: var(--accent-gold);
            cursor: pointer;
            transition: all 0.3s;
        }

        .quick-analysis-btn:hover {
            background: rgba(255, 215, 0, 0.4);
        }

        .match-meta {
            display: flex;
            justify-content: center;
            gap: 15px;
            padding: 15px;
            background: rgba(0, 0, 0, 0.2);
            border-top: 1px solid rgba(255, 215, 0, 0.1);
        }

        .meta-tag {
            padding: 5px 12px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            font-size: 12px;
            color: var(--text-secondary);
        }

        .meta-tag.highlight {
            background: rgba(255, 215, 0, 0.15);
            color: var(--accent-gold);
        }

        /* 弹窗样式 */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.85);
            z-index: 2000;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-y: auto;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            background: linear-gradient(180deg, #0a1628 0%, #1a2d4d 100%);
            border-radius: 20px;
            border: 1px solid rgba(255, 215, 0, 0.3);
            max-width: 900px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
            animation: modalSlideIn 0.3s ease-out;
        }

        @keyframes modalSlideIn {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 25px 30px;
            background: rgba(0, 0, 0, 0.3);
            border-bottom: 1px solid rgba(255, 215, 0, 0.15);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .modal-title {
            font-size: 20px;
            font-weight: 700;
            color: var(--accent-gold);
        }

        .modal-close {
            width: 36px;
            height: 36px;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            border-radius: 50%;
            color: var(--text-primary);
            font-size: 20px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-close:hover {
            background: rgba(255, 68, 68, 0.3);
            transform: rotate(90deg);
        }

        .modal-body {
            padding: 30px;
        }

        /* 弹窗内对战信息 */
        .modal-match-header {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 40px;
            margin-bottom: 30px;
            padding-bottom: 30px;
            border-bottom: 1px solid rgba(255, 215, 0, 0.1);
        }

        .modal-team {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .modal-team-flag {
            font-size: 64px;
        }

        .modal-team-name {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .modal-vs {
            font-size: 28px;
            font-weight: 900;
            color: var(--accent-gold);
        }

        /* 分析模块通用样式 */
        .analysis-module {
            margin-bottom: 30px;
        }

        .module-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
        }

        .module-icon {
            font-size: 20px;
        }

        .module-title {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .module-content {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 15px;
            padding: 20px;
        }

        /* AI预测概率 */
        .ai-probability-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        .prob-item {
            text-align: center;
            padding: 15px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .prob-bar-container {
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            margin: 10px 0;
            overflow: hidden;
        }

        .prob-fill {
            height: 100%;
            border-radius: 4px;
            transition: width 1s ease-out;
        }

        .prob-fill.win { background: var(--success-green); }
        .prob-fill.draw { background: var(--warning-orange); }
        .prob-fill.lose { background: var(--danger-red); }

        .prob-label {
            font-size: 14px;
            color: var(--text-secondary);
        }

        .prob-value {
            font-size: 28px;
            font-weight: 900;
        }

        .prob-value.win { color: var(--success-green); }
        .prob-value.draw { color: var(--warning-orange); }
        .prob-value.lose { color: var(--danger-red); }

        /* 比分预测 */
        .score-prediction-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .score-card {
            padding: 20px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .score-card-title {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 12px;
            text-align: center;
        }

        .score-main {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
        }

        .score-number {
            font-size: 48px;
            font-weight: 900;
            color: var(--accent-gold);
        }

        .score-separator {
            font-size: 32px;
            color: var(--text-muted);
        }

        .score-list {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 12px;
            flex-wrap: wrap;
        }

        .score-alt {
            padding: 4px 12px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            font-size: 14px;
            color: var(--text-secondary);
        }

        .upset-card {
            background: linear-gradient(135deg, rgba(248, 113, 113, 0.15), rgba(248, 113, 113, 0.05));
            border: 1px solid rgba(248, 113, 113, 0.3);
        }

        .upset-card .score-card-title {
            color: #f87171;
        }

        .upset-label {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 4px 10px;
            background: rgba(248, 113, 113, 0.3);
            border-radius: 10px;
            font-size: 11px;
            color: #f87171;
            margin-bottom: 8px;
        }

        /* 进球数预测 */
        .goals-chart {
            display: flex;
            align-items: flex-end;
            justify-content: space-around;
            height: 120px;
            padding: 0 10px;
        }

        .goal-bar-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .goal-bar {
            width: 40px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 6px 6px 0 0;
            transition: all 0.3s;
            position: relative;
        }

        .goal-bar.active {
            background: var(--accent-gold);
        }

        .goal-bar-percent {
            position: absolute;
            top: -25px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 11px;
            color: var(--text-muted);
            white-space: nowrap;
        }

        .goal-bar.active .goal-bar-percent {
            color: var(--accent-gold);
            font-weight: 700;
        }

        .goal-bar-label {
            font-size: 13px;
            color: var(--text-muted);
        }

        .goal-bar-wrapper:has(.goal-bar.active) .goal-bar-label {
            color: var(--accent-gold);
            font-weight: 700;
        }

        .goals-summary {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .summary-item {
            text-align: center;
        }

        .summary-value {
            font-size: 24px;
            font-weight: 900;
            color: var(--success-green);
        }

        .summary-label {
            font-size: 12px;
            color: var(--text-muted);
        }

        /* 冷门分析 */
        .upset-analysis-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 15px;
        }

        .upset-stat {
            text-align: center;
            padding: 15px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
        }

        .upset-value {
            font-size: 32px;
            font-weight: 900;
            color: var(--warning-orange);
        }

        .upset-label {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 5px;
        }

        .risk-level {
            display: flex;
            justify-content: center;
            gap: 6px;
            margin-top: 10px;
        }

        .risk-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
        }

        .risk-dot.active.low { background: var(--success-green); }
        .risk-dot.active.medium { background: var(--warning-orange); }
        .risk-dot.active.high { background: var(--danger-red); }

        .alert-box {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 15px;
            background: rgba(251, 146, 60, 0.1);
            border: 1px solid rgba(251, 146, 60, 0.2);
            border-radius: 10px;
        }

        .alert-icon {
            font-size: 18px;
        }

        .alert-text {
            font-size: 14px;
            color: var(--text-secondary);
            line-height: 1.6;
        }

        /* 优劣势分析 */
        .advantages-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .adv-card {
            padding: 20px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .adv-card.positive {
            border-left: 3px solid var(--success-green);
        }

        .adv-card.negative {
            border-left: 3px solid var(--warning-orange);
        }

        .adv-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
        }

        .adv-icon {
            font-size: 16px;
        }

        .adv-team {
            font-size: 14px;
            font-weight: 600;
            color: var(--accent-gold);
        }

        .adv-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .adv-item {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            font-size: 13px;
            color: var(--text-secondary);
            line-height: 1.5;
        }

        .adv-bullet {
            flex-shrink: 0;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            margin-top: 6px;
        }

        .adv-card.positive .adv-bullet { background: var(--success-green); }
        .adv-card.negative .adv-bullet { background: var(--warning-orange); }

        /* 核心看点 */
        .highlights-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .highlight-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            background: rgba(255, 215, 0, 0.08);
            border-radius: 10px;
        }

        .highlight-number {
            width: 28px;
            height: 28px;
            background: var(--accent-gold);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 700;
            color: var(--primary-dark);
            flex-shrink: 0;
        }

        .highlight-text {
            font-size: 14px;
            color: var(--text-primary);
        }

        /* 关键变量 */
        .variables-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .var-item {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
        }

        .var-icon {
            font-size: 24px;
            flex-shrink: 0;
        }

        .var-content {
            flex: 1;
        }

        .var-label {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .var-value {
            font-size: 14px;
            color: var(--text-primary);
            font-weight: 500;
        }

        /* 场馆信息 */
        .venue-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 15px;
        }

        .venue-stat {
            text-align: center;
            padding: 20px;
            background: rgba(96, 165, 250, 0.1);
            border-radius: 12px;
        }

        .venue-stat-value {
            font-size: 28px;
            font-weight: 900;
            color: var(--info-blue);
        }

        .venue-stat-label {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 5px;
        }

        .venue-note {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding: 15px;
            background: rgba(251, 146, 60, 0.1);
            border-radius: 10px;
            font-size: 14px;
            color: var(--text-secondary);
        }

        .venue-note-icon {
            font-size: 16px;
        }

        /* 推荐方案 */
        .recommendation-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .rec-item {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .rec-card {
            padding: 20px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            text-align: center;
        }

        .rec-card.primary {
            border-color: var(--accent-gold);
            background: rgba(255, 215, 0, 0.1);
        }

        .rec-card.secondary {
            border-color: rgba(96, 165, 250, 0.3);
            background: rgba(96, 165, 250, 0.05);
        }

        .rec-type {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .rec-card.primary .rec-type {
            color: var(--accent-gold);
        }

        .rec-value {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .rec-odds {
            font-size: 12px;
            color: var(--success-green);
            margin-top: 5px;
        }

        /* 响应式 */
        @media (max-width: 768px) {
            .match-quick-view {
                grid-template-columns: 1fr;
                gap: 20px;
            }

            .quick-vs {
                order: -1;
            }

            .modal-content {
                max-height: 95vh;
            }

            .modal-body {
                padding: 20px;
            }

            .ai-probability-grid {
                grid-template-columns: 1fr;
            }

            .score-prediction-grid,
            .advantages-grid,
            .recommendation-grid,
            .upset-analysis-grid {
                grid-template-columns: 1fr;
            }

            .variables-grid {
                grid-template-columns: 1fr;
            }

            .venue-stats {
                grid-template-columns: 1fr;
            }

            .modal-match-header {
                flex-direction: column;
                gap: 20px;
            }

            .quick-analysis-btn {
                position: static;
                margin-top: 15px;
            }
        }
    </style>
</head>
<body>
    <!-- 导航栏 -->
    <nav class="main-nav">
        <div class="nav-container">
            <div class="nav-logo">
                <span class="logo-icon">🏆</span>
                <span class="logo-text">FIFA 2026</span>
            </div>
            <ul class="nav-menu">
                <li><a href="#" class="nav-link">首页</a></li>
                <li><a href="#" class="nav-link active">实时分析</a></li>
                <li><a href="#" class="nav-link">赛程</a></li>
                <li><a href="#" class="nav-link">数据</a></li>
            </ul>
        </div>
    </nav>

    <!-- 英雄区域 -->
    <section class="hero-section analysis-hero">
        <div class="hero-overlay"></div>
        <div class="hero-content">
            <h1 class="hero-title">
                <span class="year-text">2026</span>
                <span class="world-cup-text">FIFA WORLD CUP</span>
            </h1>
            <p class="hero-subtitle analysis-tag">
                <span style="margin-right:8px">⚡</span>
                实时赛事分析 · AI智能预测
            </p>
            <div class="time-indicator">
                <span class="time-badge">
                    <span class="pulse-dot"></span>
                    未来24小时赛事
                </span>
            </div>
        </div>
    </section>

    <!-- 比赛列表 -->
    <section class="section match-analysis">
        <div class="container">
            <div id="matches-container">
                <!-- 动态生成比赛卡片 -->
            </div>
        </div>
    </section>

    <!-- 弹窗 -->
    <div class="modal-overlay" id="modal">
        <div class="modal-content" id="modal-content">
            <!-- 动态生成弹窗内容 -->
        </div>
    </div>

    <!-- 页脚 -->
    <footer class="site-footer">
        <div class="container">
            <div class="footer-content">
                <div class="footer-brand">
                    <span class="footer-logo">🏆</span>
                    <span class="footer-text">FIFA World Cup 2026</span>
                </div>
                <div class="footer-disclaimer">
                    <p>⚠️ 本页面所有预测分析仅供参考，不构成投注建议</p>
                    <p>🔬 数据来源：AI综合分析模型 v3.2</p>
                </div>
            </div>
        </div>
    </footer>

    <script>
        // 加载数据
        let analysisData = null;

        async function loadData() {
            try {
                const response = await fetch('data/analysis.json');
                analysisData = await response.json();
                renderMatches();
            } catch (error) {
                console.error('加载数据失败:', error);
                document.getElementById('matches-container').innerHTML = '<p style="text-align:center;color:#f87171;">数据加载失败</p>';
            }
        }

        // 格式化时间
        function formatMatchTime(datetime) {
            const date = new Date(datetime);
            const now = new Date();
            const diff = date - now;
            
            if (diff < 0) return '已结束';
            
            const hours = Math.floor(diff / (1000 * 60 * 60));
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            
            if (hours < 24) {
                return `今晚 ${date.getHours().toString().padStart(2, '0')}:${date.getMinutes().toString().padStart(2, '0')}`;
            }
            
            return `${(date.getMonth() + 1).toString().padStart(2, '0')}-${date.getDate().toString().padStart(2, '0')} ${date.getHours().toString().padStart(2, '0')}:${date.getMinutes().toString().padStart(2, '0')}`;
        }

        // 渲染比赛卡片
        function renderMatches() {
            const container = document.getElementById('matches-container');
            const matches = analysisData.matches;

            container.innerHTML = matches.map((match, index) => `
                <div class="match-analysis-card fade-in" style="animation-delay: ${index * 0.1}s">
                    <div class="match-quick-view" onclick="openModal(${match.id})">
                        <div class="quick-team">
                            <span class="quick-team-flag">${match.home_team.flag}</span>
                            <span class="quick-team-name">${match.home_team.name}</span>
                            <span class="quick-team-ranking">FIFA排名第${match.home_team.fifa_ranking}</span>
                        </div>
                        <div class="quick-vs">
                            <div class="quick-vs-badge">VS</div>
                            <span class="quick-match-time">${formatMatchTime(match.datetime)}</span>
                        </div>
                        <div class="quick-team">
                            <span class="quick-team-flag">${match.away_team.flag}</span>
                            <span class="quick-team-name">${match.away_team.name}</span>
                            <span class="quick-team-ranking">FIFA排名第${match.away_team.fifa_ranking}</span>
                        </div>
                        <button class="quick-analysis-btn">🔍 查看详细分析</button>
                    </div>
                    <div class="match-meta">
                        <span class="meta-tag highlight">${match.group}</span>
                        <span class="meta-tag">${match.round}</span>
                        <span class="meta-tag">🏟️ ${match.venue}</span>
                        <span class="meta-tag">📍 ${match.city}</span>
                    </div>
                </div>
            `).join('');
        }

        // 打开弹窗
        function openModal(matchId) {
            const match = analysisData.matches.find(m => m.id === matchId);
            if (!match) return;

            const a = match.analysis;
            const riskLevelClass = a.upset_analysis.risk_level;
            const riskLabels = { low: '低', medium: '中', 'medium-high': '中高', high: '高' };
            
            const modalContent = document.getElementById('modal-content');
            modalContent.innerHTML = `
                <div class="modal-header">
                    <h2 class="modal-title">📊 比赛深度分析</h2>
                    <button class="modal-close" onclick="closeModal()">✕</button>
                </div>
                <div class="modal-body">
                    <!-- 对战信息 -->
                    <div class="modal-match-header">
                        <div class="modal-team">
                            <span class="modal-team-flag">${match.home_team.flag}</span>
                            <span class="modal-team-name">${match.home_team.name}</span>
                        </div>
                        <span class="modal-vs">VS</span>
                        <div class="modal-team">
                            <span class="modal-team-flag">${match.away_team.flag}</span>
                            <span class="modal-team-name">${match.away_team.name}</span>
                        </div>
                    </div>

                    <!-- AI预测概率 -->
                    <div class="analysis-module">
                        <div class="module-header">
                            <span class="module-icon">🤖</span>
                            <span class="module-title">AI预测概率</span>
                        </div>
                        <div class="module-content">
                            <div class="ai-probability-grid">
                                <div class="prob-item win">
                                    <span class="prob-label">${match.home_team.name}胜</span>
                                    <span class="prob-value win">${a.ai_prediction.win}%</span>
                                    <div class="prob-bar-container">
                                        <div class="prob-fill win" style="width: ${a.ai_prediction.win}%"></div>
                                    </div>
                                </div>
                                <div class="prob-item draw">
                                    <span class="prob-label">平局</span>
                                    <span class="prob-value draw">${a.ai_prediction.draw}%</span>
                                    <div class="prob-bar-container">
                                        <div class="prob-fill draw" style="width: ${a.ai_prediction.draw}%"></div>
                                    </div>
                                </div>
                                <div class="prob-item lose">
                                    <span class="prob-label">${match.away_team.name}胜</span>
                                    <span class="prob-value lose">${a.ai_prediction.lose}%</span>
                                    <div class="prob-bar-container">
                                        <div class="prob-fill lose" style="width: ${a.ai_prediction.lose}%"></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- 最可能比分 -->
                    <div class="analysis-module">
                        <div class="module-header">
                            <span class="module-icon">⚽</span>
                            <span class="module-title">最可能比分</span>
                        </div>
                        <div class="module-content">
                            <div class="score-prediction-grid">
                                <div class="score-card">
                                    <div class="score-card-title">热门预测</div>
                                    <div class="score-main">
                                        <span class="score-number">${a.score_prediction.most_likely[0].split('-')[0]}</span>
                                        <span class="score-separator">-</span>
                                        <span class="score-number">${a.score_prediction.most_likely[0].split('-')[1]}</span>
                                    </div>
                                    <div class="score-list">
                                        ${a.score_prediction.most_likely.slice(1).map(s => `<span class="score-alt">${s}</span>`).join('')}
                                    </div>
                                </div>
                                <div class="score-card upset-card">
                                    <span class="upset-label">⚡ 冷门比分</span>
                                    <div class="score-main">
                                        <span class="score-number">${a.score_prediction.upset_scores[0].split('-')[0]}</span>
                                        <span class="score-separator">-</span>
                                        <span class="score-number">${a.score_prediction.upset_scores[0].split('-')[1]}</span>
                                    </div>
                                    <div class="score-list">
                                        ${a.score_prediction.upset_scores.slice(1).map(s => `<span class="score-alt" style="background:rgba(248,113,113,0.2);color:#f87171">${s}</span>`).join('')}
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- 进球数预测 -->
                    <div class="analysis-module">
                        <div class="module-header">
                            <span class="module-icon">⚽⚽</span>
                            <span class="module-title">进球数预测</span>
                        </div>
                        <div class="module-content">
                            <div class="goals-chart">
                                ${Object.entries(a.goals_prediction.distribution).map(([goals, percent]) => `
                                    <div class="goal-bar-wrapper">
                                        <div class="goal-bar ${parseInt(goals) === Math.round(a.goals_prediction.predicted_total) ? 'active' : ''}" style="height: ${Math.max(percent * 0.8, 10)}px">
                                            <span class="goal-bar-percent">${percent}%</span>
                                        </div>
                                        <span class="goal-bar-label">${goals}球</span>
                                    </div>
                                `).join('')}
                            </div>
                            <div class="goals-summary">
                                <div class="summary-item">
                                    <span class="summary-value">${a.goals_prediction.predicted_total}</span>
                                    <span class="summary-label">预测总进球</span>
                                </div>
                                <div class="summary-item">
                                    <span class="summary-value" style="color: var(--accent-gold)">大${Math.round(a.goals_prediction.predicted_total)}.5</span>
                                    <span class="summary-label">推荐选项</span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- 冷门概率与风险 -->
                    <div class="analysis-module">
                        <div class="module-header">
                            <span class="module-icon">⚡</span>
                            <span class="module-title">冷门概率与风险</span>
                        </div>
                        <div class="module-content">
                            <div class="upset-analysis-grid">
                                <div class="upset-stat">
                                    <span class="upset-value">${a.upset_analysis.probability}%</span>
                                    <span class="upset-label">冷门发生概率</span>
                                    <div class="risk-level">
                                        ${['low', 'medium', 'high'].map(level => `
                                            <span class="risk-dot ${riskLevelClass === level ? 'active ' + level : ''}"></span>
                                        `).join('')}
                                    </div>
                                </div>
                                <div class="upset-stat">
                                    <span class="upset-value" style="color: ${riskLevelClass === 'high' ? '#f87171' : riskLevelClass === 'medium' ? '#fb923c' : '#4ade80'}">${riskLabels[riskLevelClass]}</span>
                                    <span class="upset-label">风险等级</span>
                                </div>
                            </div>
                            <div class="alert-box">
                                <span class="alert-icon">💡</span>
                                <span class="alert-text">${a.upset_analysis.description}</span>
                            </div>
                        </div>
                    </div>

                    <!-- 双方优势与隐患 -->
                    <div class="analysis-module">
                        <div class="module-header">
                            <span class="module-icon">✓▲</span>
                            <span class="module-title">双方优势与隐患</span>
                        </div>
                        <div class="module-content">
                            <div class="advantages-grid">
                                <div class="adv-card positive">
                                    <div class="adv-header">
                                        <span class="adv-icon">✅</span>
                                        <span class="adv-team">${match.home_team.name} 优势</span>
                                    </div>
                                    <div class="adv-list">
                                        ${a.advantages.home.map(item => `
                                            <div class="adv-item">
                                                <span class="adv-bullet"></span>
                                                <span>${item}</span>
                                            </div>
                                        `).join('')}
                                    </div>
                                </div>
                                <div class="adv-card negative">
                                    <div class="adv-header">
                                        <span class="adv-icon">⚠️</span>
                                        <span class="adv-team">${match.home_team.name} 隐患</span>
                                    </div>
                                    <div class="adv-list">
                                        ${a.concerns.home.map(item => `
                                            <div class="adv-item">
                                                <span class="adv-bullet"></span>
                                                <span>${item}</span>
                                            </div>
                                        `).join('')}
                                    </div>
                                </div>
                                <div class="adv-card positive">
                                    <div class="adv-header">
                                        <span class="adv-icon">✅</span>
                                        <span class="adv-team">${match.away_team.name} 优势</span>
                                    </div>
                                    <div class="adv-list">
                                        ${a.advantages.away.map(item => `
                                            <div class="adv-item">
                                                <span class="adv-bullet"></span>
                                                <span>${item}</span>
                                            </div>
                                        `).join('')}
                                    </div>
                                </div>
                                <div class="adv-card negative">
                                    <div class="adv-header">
                                        <span class="adv-icon">⚠️</span>
                                        <span class="adv-team">${match.away_team.name} 隐患</span>
                                    </div>
                                    <div class="adv-list">
                                        ${a.concerns.away.map(item => `
                                            <div class="adv-item">
                                                <span class="adv-bullet"></span>
                                                <span>${item}</span>
                                            </div>
                                        `).join('')}
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- 核心看点 -->
                    <div class="analysis-module">
                        <div class="module-header">
                            <span class="module-icon">🎯</span>
                            <span class="module-title">核心看点</span>
                        </div>
                        <div class="module-content">
                            <div class="highlights-list">
                                ${a.key_highlights.map((highlight, i) => `
                                    <div class="highlight-item">
                                        <span class="highlight-number">${i + 1}</span>
                                        <span class="highlight-text">${highlight}</span>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </div>

                    <!-- 关键变量 -->
                    <div class="analysis-module">
                        <div class="module-header">
                            <span class="module-icon">🔄</span>
                            <span class="module-title">关键变量</span>
                        </div>
                        <div class="module-content">
                            <div class="variables-grid">
                                <div class="var-item">
                                    <span class="var-icon">🏔️</span>
                                    <div class="var-content">
                                        <span class="var-label">高原/海拔</span>
                                        <span class="var-value">${a.variables.altitude}</span>
                                    </div>
                                </div>
                                <div class="var-item">
                                    <span class="var-icon">🌤️</span>
                                    <div class="var-content">
                                        <span class="var-label">天气状况</span>
                                        <span class="var-value">${a.variables.weather}</span>
                                    </div>
                                </div>
                                <div class="var-item">
                                    <span class="var-icon">👨‍⚖️</span>
                                    <div class="var-content">
                                        <span class="var-label">裁判安排</span>
                                        <span class="var-value">${a.variables.referee}</span>
                                    </div>
                                </div>
                                <div class="var-item">
                                    <span class="var-icon">📋</span>
                                    <div class="var-content">
                                        <span class="var-label">轮次影响</span>
                                        <span class="var-value">${a.variables.round_impact}</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- 场馆信息 -->
                    <div class="analysis-module">
                        <div class="module-header">
                            <span class="module-icon">🏟️</span>
                            <span class="module-title">场馆信息</span>
                        </div>
                        <div class="module-content">
                            <div class="venue-stats">
                                <div class="venue-stat">
                                    <span class="venue-stat-value">${a.venue_info.capacity.toLocaleString()}</span>
                                    <span class="venue-stat-label">容纳人数</span>
                                </div>
                                <div class="venue-stat">
                                    <span class="venue-stat-value">${a.venue_info.surface}</span>
                                    <span class="venue-stat-label">草皮类型</span>
                                </div>
                                <div class="venue-stat">
                                    <span class="venue-stat-value">${a.venue_info.home_advantage}</span>
                                    <span class="venue-stat-label">主场优势</span>
                                </div>
                            </div>
                            <div class="venue-note">
                                <span class="venue-note-icon">📍</span>
                                <span>比赛场馆：${match.venue}（${match.city}）</span>
                            </div>
                        </div>
                    </div>

                    <!-- 推荐方案 -->
                    <div class="analysis-module">
                        <div class="module-header">
                            <span class="module-icon">🎯</span>
                            <span class="module-title">推荐方案</span>
                        </div>
                        <div class="module-content">
                            <div class="recommendation-grid">
                                <div class="rec-item">
                                    <span class="rec-type">🏆 首选</span>
                                    <div class="rec-card primary">
                                        <span class="rec-value">${a.recommendations.primary}</span>
                                    </div>
                                </div>
                                <div class="rec-item">
                                    <span class="rec-type">🥈 次选</span>
                                    <div class="rec-card secondary">
                                        <span class="rec-value">${a.recommendations.secondary}</span>
                                    </div>
                                </div>
                                <div class="rec-item">
                                    <span class="rec-type">⚽ 比分推荐</span>
                                    <div class="rec-card">
                                        <span class="rec-value">${a.recommendations.correct_score}</span>
                                    </div>
                                </div>
                                <div class="rec-item">
                                    <span class="rec-type">🔢 进球推荐</span>
                                    <div class="rec-card">
                                        <span class="rec-value">${a.recommendations.goals}</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                </div>
            `;

            document.getElementById('modal').classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        // 关闭弹窗
        function closeModal() {
            document.getElementById('modal').classList.remove('active');
            document.body.style.overflow = '';
        }

        // 点击遮罩关闭
        document.getElementById('modal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeModal();
            }
        });

        // ESC键关闭
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeModal();
            }
        });

        // 初始化
        loadData();
    </script>
</body>
</html>
