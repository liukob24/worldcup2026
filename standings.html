<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小组积分 - 2026世界杯预测分析</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- 导航栏 -->
    <nav class="main-nav" id="mainNav">
        <div class="nav-container">
            <a href="index.html" class="nav-logo">
                <span class="logo-icon">⚽</span>
                <span class="logo-text">世界杯预测</span>
            </a>
            <ul class="nav-menu" id="navMenu">
                <li><a href="index.html" class="nav-link">首页</a></li>
                <li><a href="schedule.html" class="nav-link">赛程</a></li>
                <li><a href="standings.html" class="nav-link active">小组积分</a></li>
                <li><a href="news.html" class="nav-link">赛事新闻</a></li>
                <li><a href="analysis.html" class="nav-link">实时分析</a></li>
            </ul>
            <button class="nav-toggle" id="navToggle">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>
    </nav>

    <!-- 主内容 -->
    <main class="page-content">
        <div class="container">
            <div class="section-header">
                <span class="section-badge">积分榜</span>
                <h1 class="section-title">小组积分榜</h1>
                <p class="section-desc">实时更新12组48队积分排名，掌握晋级形势</p>
            </div>

            <!-- 筛选栏 -->
            <div class="filter-bar">
                <div class="filter-tabs" id="filterTabs">
                    <button class="filter-tab all active" data-group="all">全部</button>
                    <button class="filter-tab" data-group="A">A组</button>
                    <button class="filter-tab" data-group="B">B组</button>
                    <button class="filter-tab" data-group="C">C组</button>
                    <button class="filter-tab" data-group="D">D组</button>
                    <button class="filter-tab" data-group="E">E组</button>
                    <button class="filter-tab" data-group="F">F组</button>
                    <button class="filter-tab" data-group="G">G组</button>
                    <button class="filter-tab" data-group="H">H组</button>
                    <button class="filter-tab" data-group="I">I组</button>
                    <button class="filter-tab" data-group="J">J组</button>
                    <button class="filter-tab" data-group="K">K组</button>
                    <button class="filter-tab" data-group="L">L组</button>
                </div>
            </div>

            <!-- 积分榜容器 -->
            <div id="standingsContainer">
                <!-- 动态加载 -->
            </div>
        </div>
    </main>

    <!-- 页脚 -->
    <footer class="site-footer">
        <div class="container">
            <div class="footer-content">
                <div class="footer-brand">
                    <span class="footer-logo">⚽</span>
                    <span class="footer-text">2026世界杯预测分析</span>
                </div>
                <div class="footer-disclaimer">
                    <p>本平台仅供娱乐参考，请理性观看比赛</p>
                    <p>AI预测结果仅供参考，不构成投注建议</p>
                </div>
            </div>
        </div>
    </footer>

    <script>
        // 数据
        let standingsData = null;
        let currentGroup = 'all';

        // 初始化
        document.addEventListener('DOMContentLoaded', async () => {
            initNavigation();
            await loadData();
            initFilters();
            renderStandings();
        });

        // 导航
        function initNavigation() {
            const navToggle = document.getElementById('navToggle');
            const navMenu = document.getElementById('navMenu');
            const mainNav = document.getElementById('mainNav');

            navToggle.addEventListener('click', () => {
                navToggle.classList.toggle('active');
                navMenu.classList.toggle('active');
            });

            window.addEventListener('scroll', () => {
                if (window.scrollY > 100) {
                    mainNav.classList.add('scrolled');
                } else {
                    mainNav.classList.remove('scrolled');
                }
            });
        }

        // 加载数据
        async function loadData() {
            try {
                const res = await fetch('data/standings.json');
                standingsData = await res.json();
            } catch (e) {
                console.error('数据加载失败:', e);
                document.getElementById('standingsContainer').innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">⚠️</div>
                        <div class="empty-state-title">数据加载失败</div>
                        <p class="empty-state-desc">请刷新页面重试</p>
                    </div>
                `;
            }
        }

        // 筛选器
        function initFilters() {
            const tabs = document.querySelectorAll('.filter-tab');
            tabs.forEach(tab => {
                tab.addEventListener('click', () => {
                    tabs.forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');
                    currentGroup = tab.dataset.group;
                    renderStandings();
                });
            });
        }

        // 球队代码映射
        const teamCodes = {
            '墨西哥': 'MEX', '南非': 'RSA', '韩国': 'KOR', '捷克': 'CZE',
            '加拿大': 'CAN', '波黑': 'BIH', '卡塔尔': 'QAT', '瑞士': 'SUI',
            '巴西': 'BRA', '摩洛哥': 'MAR', '海地': 'HAI', '苏格兰': 'SCO',
            '美国': 'USA', '巴拉圭': 'PAR', '澳大利亚': 'AUS', '土耳其': 'TUR',
            '德国': 'GER', '库拉索': 'CUW', '科特迪瓦': 'CIV', '厄瓜多尔': 'ECU',
            '荷兰': 'NED', '日本': 'JPN', '瑞典': 'SWE', '突尼斯': 'TUN',
            '比利时': 'BEL', '埃及': 'EGY', '伊朗': 'IRN', '新西兰': 'NZL',
            '西班牙': 'ESP', '佛得角': 'CPV', '沙特': 'KSA', '乌拉圭': 'URU',
            '法国': 'FRA', '塞内加尔': 'SEN', '伊拉克': 'IRQ', '挪威': 'NOR',
            '阿根廷': 'ARG', '阿尔及利亚': 'ALG', '奥地利': 'AUT', '约旦': 'JOR',
            '葡萄牙': 'POR', '刚果民主共和国': 'COD', '乌兹别克斯坦': 'UZB', '哥伦比亚': 'COL',
            '英格兰': 'ENG', '克罗地亚': 'CRO', '加纳': 'GHA', '巴拿马': 'PAN'
        };

        // 球队国旗emoji映射
        const teamFlags = {
            '墨西哥': '🇲🇽', '南非': '🇿🇦', '韩国': '🇰🇷', '捷克': '🇨🇿',
            '加拿大': '🇨🇦', '波黑': '🇧🇦', '卡塔尔': '🇶🇦', '瑞士': '🇨🇭',
            '巴西': '🇧🇷', '摩洛哥': '🇲🇦', '海地': '🇭🇹', '苏格兰': '🏴󠁧󠁢󠁳󠁣󠁴󠁿',
            '美国': '🇺🇸', '巴拉圭': '🇵🇾', '澳大利亚': '🇦🇺', '土耳其': '🇹🇷',
            '德国': '🇩🇪', '库拉索': '🇨🇼', '科特迪瓦': '🇨🇮', '厄瓜多尔': '🇪🇨',
            '荷兰': '🇳🇱', '日本': '🇯🇵', '瑞典': '🇸🇪', '突尼斯': '🇹🇳',
            '比利时': '🇧🇪', '埃及': '🇪🇬', '伊朗': '🇮🇷', '新西兰': '🇳🇿',
            '西班牙': '🇪🇸', '佛得角': '🇨🇻', '沙特': '🇸🇦', '乌拉圭': '🇺🇾',
            '法国': '🇫🇷', '塞内加尔': '🇸🇳', '伊拉克': '🇮🇶', '挪威': '🇳🇴',
            '阿根廷': '🇦🇷', '阿尔及利亚': '🇩🇿', '奥地利': '🇦🇹', '约旦': '🇯🇴',
            '葡萄牙': '🇵🇹', '刚果民主共和国': '🇨🇩', '乌兹别克斯坦': '🇺🇿', '哥伦比亚': '🇨🇴',
            '英格兰': '🏴󠁧󠁢󠁥󠁮󠁧󠁿', '克罗地亚': '🇭🇷', '加纳': '🇬🇭', '巴拿马': '🇵🇦'
        };

        // 渲染积分榜
        function renderStandings() {
            const container = document.getElementById('standingsContainer');
            if (!standingsData || !standingsData.groups) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">🏆</div>
                        <div class="empty-state-title">暂无积分数据</div>
                        <p class="empty-state-desc">世界杯即将开始</p>
                    </div>
                `;
                return;
            }

            let groups = standingsData.groups;
            if (currentGroup !== 'all') {
                groups = groups.filter(g => g.id === currentGroup);
            }

            if (groups.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">🏆</div>
                        <div class="empty-state-title">暂无数据</div>
                    </div>
                `;
                return;
            }

            container.innerHTML = groups.map(group => `
                <div class="standings-container" style="margin-bottom: 30px;">
                    <div class="standings-header">
                        <h3 class="standings-title">
                            <span>🏆</span>
                            <span>${group.name}</span>
                        </h3>
                    </div>
                    <div style="overflow-x: auto;">
                        <table class="standings-table">
                            <thead>
                                <tr>
                                    <th style="width: 50px;">排名</th>
                                    <th style="text-align: left;">球队</th>
                                    <th>场</th>
                                    <th>胜</th>
                                    <th>平</th>
                                    <th>负</th>
                                    <th>进</th>
                                    <th>失</th>
                                    <th>净胜</th>
                                    <th>积分</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${group.teams.map((team, index) => {
                                    const gd = team.goalDifference !== undefined ? team.goalDifference : (team.goalsFor - team.goalsAgainst);
                                    const gdClass = gd > 0 ? 'gd-positive' : gd < 0 ? 'gd-negative' : '';
                                    const rankClass = index === 0 ? 'rank-1' : index === 1 ? 'rank-2' : index === 2 ? 'rank-3' : 'rank-4';
                                    
                                    return `
                                        <tr>
                                            <td class="${rankClass}">${index + 1}</td>
                                            <td style="text-align: left;">
                                                <div class="team-cell">
                                                    <span style="font-size: 1.3rem;">${teamFlags[team.name] || '🏳️'}</span>
                                                    <span>${team.name}</span>
                                                </div>
                                            </td>
                                            <td>${team.played}</td>
                                            <td>${team.won}</td>
                                            <td>${team.drawn}</td>
                                            <td>${team.lost}</td>
                                            <td>${team.goalsFor}</td>
                                            <td>${team.goalsAgainst}</td>
                                            <td class="${gdClass}">${gd > 0 ? '+' : ''}${gd}</td>
                                            <td class="points-cell">${team.points}</td>
                                        </tr>
                                    `;
                                }).join('')}
                            </tbody>
                        </table>
                    </div>
                    <div style="padding: 15px 25px; background: rgba(136, 146, 176, 0.05); border-top: 1px solid rgba(136, 146, 176, 0.1);">
                        <div style="display: flex; gap: 20px; font-size: 0.8rem; color: var(--text-muted);">
                            <span><span style="color: #4ade80;">●</span> 出线</span>
                            <span><span style="color: #fb923c;">●</span> 待定</span>
                            <span><span style="color: #f87171;">●</span> 淘汰</span>
                        </div>
                    </div>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
